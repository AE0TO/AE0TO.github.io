<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iridescent Jukebox</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent-iridescent: linear-gradient(45deg, #ff00cc, #3333ff, #00ffcc, #ffcc00);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Jukebox Container */
        .jukebox-shell {
            width: 90vw;
            max-width: 1000px;
            height: 80vh;
            background: linear-gradient(145deg, #111, #000);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Header / Now Playing */
        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }

        .label {
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        .artist-title {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff 30%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Equalizer Section */
        .visualizer-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 250px;
            /* This gives the waveform its high-quality bloom */
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.3));
        }

        /* Bottom Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .playback-btns {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn {
            background: var(--panel-color);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .btn-play {
            background: white;
            color: black;
            font-weight: bold;
            padding: 15px 40px;
        }

        .track-info-bottom {
            text-align: right;
        }

        .track-time {
            font-family: monospace;
            color: #00ffcc;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="jukebox-shell">
        <div class="now-playing">
            <span class="label">Now Streaming</span>
            <div class="artist-title" id="display-text">Tame Impala, Let It Happen</div>
        </div>

        <div class="visualizer-area">
            <canvas id="waveform"></canvas>
        </div>

        <div class="controls">
            <div class="playback-btns">
                <button class="btn">Prev</button>
                <button class="btn btn-play">PAUSE</button>
                <button class="btn">Next</button>
            </div>
            
            <div class="track-info-bottom">
                <div class="track-time" id="timer">03:42</div>
                <div style="font-size: 12px; color: #555;">High Fidelity Audio</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');
        let width, height;
        let offset = 0;

        function resize() {
            width = canvas.width = canvas.offsetWidth * 2; // Higher DPI
            height = canvas.height = canvas.offsetHeight * 2;
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Create Iridescent Gradient
            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, '#ff00cc'); // Pink-Magenta
            gradient.addColorStop(0.2, '#3333ff'); // Deep Blue
            gradient.addColorStop(0.4, '#00ccff'); // Sky Blue
            gradient.addColorStop(0.6, '#00ffcc'); // Teal
            gradient.addColorStop(0.8, '#ffff00'); // Yellow-Gold
            gradient.addColorStop(1, '#ff00cc'); // Back to Pink for loop feel

            // We draw multiple lines with different offsets for a "premium" layered look
            drawWave(offset, gradient, 1, 60);
            drawWave(offset * 0.8, 'rgba(255,255,255,0.1)', 0.5, 40); // Subtle white shadow wave
            
            offset += 0.04; 
            requestAnimationFrame(draw);
        }

        function drawWave(shift, color, alpha, amp) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let x = 0; x < width; x += 2) {
                // Complex wave formula: combines three sine waves for organic motion
                const baseHeight = height / 2;
                const wave1 = Math.sin(x * 0.005 + shift) * amp;
                const wave2 = Math.sin(x * 0.01 + shift * 1.5) * (amp / 2);
                const wave3 = Math.sin(x * 0.02 - shift) * (amp / 4);
                
                const y = baseHeight + wave1 + wave2 + wave3;

                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        draw();

        // Simple Timer Logic
        setInterval(() => {
            const timer = document.getElementById('timer');
            let parts = timer.innerText.split(':');
            let sec = parseInt(parts[1]) + 1;
            let min = parseInt(parts[0]);
            if(sec > 59) { sec = 0; min++; }
            timer.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
