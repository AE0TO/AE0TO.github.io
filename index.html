        :root {
            --neon-blue: #00d2ff;
            --dark-bg: #0a0b10;

        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: linear-gradient(to bottom, #161b22, var(--dark-bg));
            border-bottom: 1px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 20px;
        }

        .player-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            margin-bottom: 20px;
        }

        #now-playing {
            font-size: 1.2rem;
            color: var(--neon-blue);
            margin-bottom: 15px;
            height: 1.5em;
        }

        audio {
            width: 100%;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5);
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background: transparent;
            color: white;
            border: 1px solid var(--neon-blue);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--neon-blue);
            color: black;
        }

        #search-bar {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            margin-bottom: 20px;
            outline: none;
            border: 1px solid transparent;
        }

        #search-bar:focus {
            border-color: var(--neon-blue);
        }

        .track-list {
            max-height: 50vh;
            overflow-y: auto;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
        }

        .track-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .track-item:hover {
            background: rgba(0, 210, 255, 0.1);
        }

        .track-item.active {
            border-left: 4px solid var(--neon-blue);
            background: rgba(0, 210, 255, 0.1);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
    </style>
</head>

    ];

    let currentTrackIndex = -1;
    const player = document.getElementById('audio-player');
    const display = document.getElementById('now-playing');
    const container = document.getElementById('list-container');

    // Initialize the list
    function renderList(list = tracks) {
        container.innerHTML = '';
        list.forEach((track, index) => {
            const div = document.createElement('div');
            div.className = 'track-item';
            div.innerHTML = `<span>${track.name}</span>`;
            div.onclick = () => playTrack(index);
            container.appendChild(div);
        });
    }

    function playTrack(index) {
        if(index < 0 || index >= tracks.length) return;
        currentTrackIndex = index;
        player.src = tracks[index].url;
        display.innerText = tracks[index].name;
        player.play();
        highlightTrack();
    }

    function highlightTrack() {
        const items = document.querySelectorAll('.track-item');
        items.forEach((item, idx) => {
            item.classList.remove('active');
            if(idx === currentTrackIndex) item.classList.add('active');
        });
    }

    function nextTrack() {
        let next = currentTrackIndex + 1;
        if(next >= tracks.length) next = 0;
        playTrack(next);
    }

    function prevTrack() {
        let prev = currentTrackIndex - 1;
        if(prev < 0) prev = tracks.length - 1;
        playTrack(prev);
    }

    function shuffleLibrary() {
        for (let i = tracks.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
        }
        renderList();
        playTrack(0);
    }

    function filterTracks() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const filtered = tracks.filter(t => t.name.toLowerCase().includes(query));
        container.innerHTML = '';
        filtered.forEach((track) => {
            const originalIndex = tracks.findIndex(t => t.url === track.url);
            const div = document.createElement('div');
            div.className = 'track-item';
            div.innerHTML = `<span>${track.name}</span>`;
            div.onclick = () => playTrack(originalIndex);
            container.appendChild(div);
        });
    }

    // Auto-play next track
    player.onended = nextTrack;

    // Load initial list
    renderList();
</script>
