<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE0TO // COMMAND HOLODECK</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&family=Bungee+Inline&display=swap" rel="stylesheet">
    <style>
        :root {
            --hologram-cyan: #00f2ff;
            --hologram-cyan-glow: rgba(0, 242, 255, 0.4);
            --atomic-orange: #ff9d00;
            --atomic-glow: rgba(255, 157, 0, 0.6);
            --deep-space: #01080e;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0; padding: 0; background: var(--deep-space); color: white;
            font-family: 'Share Tech Mono', monospace; overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, #0a1b2a 0%, #01080e 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            background-size: 100% 100%, 100% 3px;
        }

        /* --- THE GLASS HUD --- */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        /* --- HEADER --- */
        .hud-header {
            padding: 40px; text-align: center; border-bottom: 2px solid var(--hologram-cyan-glow);
            position: relative; overflow: hidden;
        }
        .hud-header h1 {
            font-family: 'Orbitron'; font-size: clamp(2rem, 8vw, 5rem); margin: 0;
            color: var(--hologram-cyan); text-shadow: 0 0 20px var(--hologram-cyan);
            letter-spacing: 15px;
        }

        /* --- JUKEBOX CONSOLE --- */
        .juke-holodeck {
            max-width: 900px; margin: 50px auto; padding: 40px;
            border: 2px solid var(--atomic-orange);
            box-shadow: 0 0 40px var(--atomic-glow), inset 0 0 20px var(--atomic-glow);
            position: relative; text-align: center;
        }

        .reactor-core {
            width: 220px; height: 220px; margin: 0 auto 30px;
            border-radius: 50%; border: 4px double var(--atomic-orange);
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, var(--atomic-glow) 0%, transparent 70%);
            animation: pulse 2s infinite ease-in-out;
        }
        
        .spinning-ring {
            width: 180px; height: 180px; border-radius: 50%;
            border: 2px dashed var(--atomic-orange);
            animation: rotate 10s linear infinite;
            animation-play-state: paused;
        }

        .track-info-display {
            background: rgba(0, 0, 0, 0.7); padding: 25px; border-radius: 5px;
            border-left: 8px solid var(--atomic-orange); margin-bottom: 30px;
        }

        .track-title { font-family: 'Bungee Inline'; font-size: 2rem; color: var(--atomic-orange); }
        .track-meta { font-size: 1rem; opacity: 0.6; color: var(--hologram-cyan); letter-spacing: 3px; }

        .btn-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .control-btn {
            background: transparent; border: 1px solid var(--hologram-cyan);
            color: var(--hologram-cyan); padding: 12px 25px; font-family: 'Orbitron';
            cursor: pointer; transition: 0.3s; font-size: 0.8rem;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }
        .control-btn:hover { background: var(--hologram-cyan); color: #000; box-shadow: 0 0 15px var(--hologram-cyan); }

        /* --- SCANLINE EFFECT --- */
        .scanline {
            width: 100%; height: 100px; background: linear-gradient(0deg, transparent, rgba(0, 242, 255, 0.05), transparent);
            position: fixed; top: -100px; left: 0; z-index: 100; pointer-events: none;
            animation: scan 6s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes scan { 0% { top: -100px; } 100% { top: 100vh; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

    </style>
</head>

        // Format into usable objects
        let tracks = rawTracks.map((url, index) => {
            let hash = url.split('/').pop().substring(0, 8).toUpperCase();
            return {
                id: `FREQ_ID: ${index + 1}`,
                name: `SIG_INTERCEPT_${hash}`,
                src: url
            };
        });

        let currentIdx = 0;
        const player = document.getElementById('comms-audio');
        const powerBtn = document.getElementById('master-power');
        const ring = document.getElementById('ring');

        function shuffleNow() {
            tracks.sort(() => Math.random() - 0.5);
            currentIdx = 0;
            loadTrack(0);
            if (!player.paused) player.play();
        }

        function loadTrack(idx) {
            const track = tracks[idx];
            document.getElementById('track-id').innerText = track.id;
            document.getElementById('track-name').innerText = track.name;
            player.src = track.src;
        }

        function togglePower() {
            if (player.paused) {
                player.play();
                powerBtn.innerText = "MASTER_POWER: ON";
                powerBtn.style.boxShadow = "0 0 20px var(--atomic-orange)";
                ring.style.animationPlayState = "running";
            } else {
                player.pause();
                powerBtn.innerText = "MASTER_POWER: OFF";
                powerBtn.style.boxShadow = "none";
                ring.style.animationPlayState = "paused";
            }
        }

        function nextTrack() {
            currentIdx = (currentIdx + 1) % tracks.length;
            loadTrack(currentIdx);
            player.play();
            ring.style.animationPlayState = "running";
        }

        function prevTrack() {
            currentIdx = (currentIdx - 1 + tracks.length) % tracks.length;
            loadTrack(currentIdx);
            player.play();
        }

        // INIT
        shuffleNow();
    </script>
